<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ക്ലാസ് ടെസ്റ്റ് - അഡ്മിൻ & സ്റ്റുഡന്റ് പാനൽ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fcf8f2; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px solid #14532d; }
        .header-box { background: #14532d; color: white; padding: 15px; text-align: center; border-radius: 8px; font-weight: bold; margin-bottom: 15px; }
        .sub-box { background: #fff; border: 2px solid #14532d; border-radius: 10px; padding: 12px; margin-bottom: 15px; }
        .btn-green { background: #22c55e; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-blue { background: #2563eb; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-red { background: #ef4444; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .tab-nav { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .tab-nav button { width: 48%; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; border: 2px solid #14532d; }
        .active-tab { background: #14532d; color: white; }
        .eval-card { background: #f9fafb; border: 1px solid #d1d5db; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        📚 ക്ലാസ് ടെസ്റ്റ് & ഇവന്റ് മാനേജർ (Secure V9.17.4)
    </div>

    <!-- Navigation Tabs -->
    <div class="tab-nav">
        <button id="tabAdminBtn" class="active-tab" onclick="switchMainTab('admin')">അഡ്മിൻ ഡാഷ്‌ബോർഡ്</button>
        <button id="tabStudentBtn" onclick="switchMainTab('student')">വിദ്യാർത്ഥി മോഡ്</button>
    </div>

    <!-- ================= ADMIN SECTION ================= -->
    <div id="adminPanelSection">
        <div class="sub-box" style="border-color: #14532d;">
            <h3>1. പുതിയ ക്ലാസ് ടെസ്റ്റ് ഇവന്റ് നിർമ്മിക്കുക</h3>
            <label>ഇവന്റ് പേര് (ഉദാ: നിബ്രസൂൽ ഉലൂം മദ്രസ 8th Standard Class Test):</label>
            <input type="text" id="eventName" placeholder="ഇവന്റ് പേര് നൽകുക">
            
            <label>സ്ഥലം / സ്ഥാപനം:</label>
            <input type="text" id="eventPlace" placeholder="സ്ഥലം നൽകുക">

            <label>ലോഗോ അപ്‌ലോഡ് ചെയ്യുക:</label>
            <input type="file" id="eventLogo" accept="image/*">

            <label>ബാനർ അപ്‌ലോഡ് ചെയ്യുക:</label>
            <input type="file" id="eventBanner" accept="image/*">

            <label>വാല്യുവേഷൻ മോഡ്:</label>
            <select id="evalMode">
                <option value="auto">ഓട്ടോമാറ്റിക് വാല്യുവേഷൻ (Key Match)</option>
                <option value="manual">മാനുവൽ വാല്യുവേഷൻ (അധ്യാപകൻ ടിക്ക് ഇടേണ്ടത്)</option>
            </select>

            <label>ചോദ്യങ്ങളും ഉത്തരങ്ങളും ബൾക്ക് ആയി ചേർക്കുക (Format: Q | a,b,c,d | Answer | Marks):</label>
            <textarea id="bulkQuestions" rows="4" placeholder="ഉദാ: ഇന്ത്യയുടെ തലസ്ഥാനം ഏത്? | ഡൽഹി,മുംബൈ,കൊൽക്കത്ത,ചെന്നൈ | ഡൽഹി | 5"></textarea>

            <button class="btn-green" onclick="createNewTestEvent()">🚀 പുതിയ ലിങ്ക് ക്രിയേറ്റ് ചെയ്യുക</button>
        </div>

        <!-- Created Events List (Like Screenshot 1) -->
        <div class="sub-box">
            <h3>📋 നിലവിലുള്ള ഇവന്റുകൾ (Events Board)</h3>
            <div id="eventsListContainer">
                <!-- Dynamic Events Will Load Here -->
            </div>
        </div>

        <!-- Manual Evaluation Section -->
        <div class="sub-box" style="border-color: #d97706;">
            <h3>📝 മാനുവൽ പേപ്പർ വാല്യുവേഷൻ (Teacher Check)</h3>
            <select id="selectEventForEval" onchange="loadStudentSubmissions()">
                <option value="">ഇവന്റ് തിരഞ്ഞെടുക്കുക</option>
            </select>
            <div id="studentPapersContainer">
                <!-- Student submissions for checking will appear here -->
            </div>
        </div>
    </div>

    <!-- ================= STUDENT SECTION ================= -->
    <div id="studentPanelSection" style="display:none;">
        <div class="sub-box" id="studentLoginBox">
            <h3 id="studEventTitle">ക്ലാസ് ടെസ്റ്റിലേക്ക് സ്വാഗതം</h3>
            <p id="studEventDetails"></p>
            <input type="text" id="studentNameInput" placeholder="നിങ്ങളുടെ മുഴുവൻ പേര്">
            <input type="text" id="studentPhoneInput" placeholder="ഫോൺ നമ്പർ / റോൾ നമ്പർ">
            <button class="btn-green" onclick="startStudentTest()">ടെസ്റ്റ് ആരംഭിക്കുക</button>
        </div>

        <div id="studentTestBox" style="display:none;">
            <div id="studentQuestionsArea"></div>
            <label>ഫോട്ടോ അല്ലെങ്കിൽ ഡോക്യുമെന്റ് അപ്‌ലോഡ് ചെയ്യുക (ആവശ്യമെങ്കിൽ - Compressed):</label>
            <input type="file" id="studentDocUpload" accept="image/*">
            <button class="btn-blue" onclick="submitStudentAnswers()">ഉത്തരങ്ങൾ സമർപ്പിക്കുക</button>
        </div>

        <div id="studentResultBox" style="display:none; text-align:center;">
            <h3>🎉 ടെസ്റ്റ് പൂർത്തിയായി!</h3>
            <p id="resultStatusText" style="color: green; font-weight: bold;"></p>
            <p id="detailedScoreCard"></p>
            <button class="btn-green" onclick="downloadCertificate()">🏆 സർട്ടിഫിക്കറ്റ് ഡൗൺലോഡ് ചെയ്യുക</button>
            <button class="btn-blue" onclick="viewAnswerKey()" style="margin-top: 10px;">🔑 ആൻസർ കീ കാണുക</button>
        </div>
    </div>
</div>

<script>
    // Local Database Simulation for Events & Submissions
    let eventsData = JSON.parse(localStorage.getItem('classTestEvents')) || [];
    let submissionsData = JSON.parse(localStorage.getItem('classTestSubs')) || {};

    function switchMainTab(tab) {
        if(tab === 'admin') {
            document.getElementById('adminPanelSection').style.display = 'block';
            document.getElementById('studentPanelSection').style.display = 'none';
            document.getElementById('tabAdminBtn').classList.add('active-tab');
            document.getElementById('tabStudentBtn').classList.remove('active-tab');
            renderEventsList();
            loadEvalDropdown();
        } else {
            document.getElementById('adminPanelSection').style.display = 'none';
            document.getElementById('studentPanelSection').style.display = 'block';
            document.getElementById('tabStudentBtn').classList.add('active-tab');
            document.getElementById('tabAdminBtn').classList.remove('active-tab');
        }
    }

    function createNewTestEvent() {
        let name = document.getElementById('eventName').value;
        let place = document.getElementById('eventPlace').value;
        let mode = document.getElementById('evalMode').value;
        let rawQ = document.getElementById('bulkQuestions').value;

        if(!name || !rawQ) {
            alert("ദയവായി ഇവന്റ് പേരും ചോദ്യങ്ങളും നൽകുക!");
            return;
        }

        let questions = rawQ.split('\n').map(line => {
            let parts = line.split('|');
            return {
                q: parts[0] ? parts[0].trim() : '',
                options: parts[1] ? parts[1].split(',').map(o => o.trim()) : [],
                answer: parts[2] ? parts[2].trim() : '',
                marks: parts[3] ? parseInt(parts[3].trim()) : 5
            };
        });

        let newEvent = {
            id: 'ID_' + Date.now(),
            name: name,
            place: place,
            mode: mode,
            questions: questions,
            date: new Date().toLocaleDateString()
        };

        eventsData.push(newEvent);
        localStorage.setItem('classTestEvents', JSON.stringify(eventsData));
        alert("ഇവന്റ് വിജയകരമായി ക്രിയേറ്റ് ചെയ്തു!");
        renderEventsList();
        loadEvalDropdown();
    }

    function renderEventsList() {
        let container = document.getElementById('eventsListContainer');
        container.innerHTML = "";
        if(eventsData.length === 0) {
            container.innerHTML = "<p>ഇവന്റുകൾ ഒന്നുംമില്ല.</p>";
            return;
        }

        eventsData.forEach((ev, idx) => {
            let shareLink = window.location.href.split('?')[0] + "?event=" + ev.id;
            container.innerHTML += `
                <div style="background:#f3f4f6; padding:10px; border-radius:8px; margin-bottom:10px; border:1px solid #cbd5e1;">
                    <b>${ev.name}</b> (${ev.place})<br>
                    <small>ചോദ്യങ്ങൾ: ${ev.questions.length} | മോഡ്: ${ev.mode}</small><br>
                    <input type="text" value="${shareLink}" readonly style="background:#fff; margin:5px 0;">
                    <button class="btn-green" onclick="navigator.clipboard.writeText('${shareLink}'); alert('ലിങ്ക് കോപ്പി ചെയ്തു!');">📋 കോപ്പി ലിങ്ക്</button>
                    <button class="btn-red" onclick="deleteEvent(${idx})" style="margin-top:5px;">🗑️ ഡിലീറ്റ് ചെയ്യുക</button>
                </div>
            `;
        });
    }

    function deleteEvent(index) {
        if(confirm("ഈ ഇവന്റ് ഡിലീറ്റ് ചെയ്യണമെന്നുറപ്പാണോ?")) {
            eventsData.splice(index, 1);
            localStorage.setItem('classTestEvents', JSON.stringify(eventsData));
            renderEventsList();
            loadEvalDropdown();
        }
    }

    function loadEvalDropdown() {
        let select = document.getElementById('selectEventForEval');
        select.innerHTML = '<option value="">ഇവന്റ് തിരഞ്ഞെടുക്കുക</option>';
        eventsData.forEach(ev => {
            select.innerHTML += `<option value="${ev.id}">${ev.name}</option>`;
        });
    }

    function loadStudentSubmissions() {
        let eventId = document.getElementById('selectEventForEval').value;
        let container = document.getElementById('studentPapersContainer');
        container.innerHTML = "";
        
        let subs = submissionsData[eventId] || [];
        if(subs.length === 0) {
            container.innerHTML = "<p>കുട്ടികളുടെ സബ്മിഷനുകൾ ഒന്നും ലഭ്യമല്ല.</p>";
            return;
        }

        subs.forEach((sub, sIdx) => {
            container.innerHTML += `
                <div class="eval-card">
                    <p><b>വിദ്യാർത്ഥി:</b> ${sub.name} (${sub.phone})</p>
                    <p><b>സ്റ്റാറ്റസ്:</b> <span style="color:green;">🟢 വാല്യുവേഷൻ കഴിഞ്ഞു / പരിശോധനയിലുണ്ട്</span></p>
                    <p><b>ലഭിച്ച മാർക്ക്:</b> ${sub.score || 'പെൻഡിങ്'}</p>
                </div>
            `;
        });
    }

    // URL Check to load Student View Directly if Link is Clicked
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');
        if(eventId) {
            switchMainTab('student');
            let ev = eventsData.find(e => e.id === eventId);
            if(ev) {
                document.getElementById('studEventTitle').innerText = ev.name;
                document.getElementById('studEventDetails').innerText = `സ്ഥലം: ${ev.place}`;
                window.currentActiveEvent = ev;
            } else {
                document.getElementById('studEventTitle').innerText = "ഇവന്റ് കണ്ടെത്താനായില്ല!";
            }
        } else {
            renderEventsList();
            loadEvalDropdown();
        }
    };

    let activeStudentAnswers = {};
    function startStudentTest() {
        let name = document.getElementById('studentNameInput').value;
        let phone = document.getElementById('studentPhoneInput').value;
        if(!name || !phone) {
            alert("പേരും ഫോൺ നമ്പറും നൽകുക!");
            return;
        }

        document.getElementById('studentLoginBox').style.display = 'none';
        document.getElementById('studentTestBox').style.display = 'block';

        let qArea = document.getElementById('studentQuestionsArea');
        qArea.innerHTML = "";

        window.currentActiveEvent.questions.forEach((q, qIdx) => {
            let html = `<div style="background:#fafaf9; padding:10px; margin-bottom:10px; border-radius:6px; border:1px solid #e7e5e4;">
                <p><b>ചോദ്യം ${qIdx+1}:</b> ${q.q} (${q.marks} മാർക്ക്)</p>`;
            
            if(q.options && q.options.length > 0) {
                q.options.forEach(opt => {
                    html += `<label><input type="radio" name="sq_${qIdx}" value="${opt}"> ${opt}</label><br>`;
                });
            } else {
                html += `<input type="text" id="ans_input_${qIdx}" placeholder="ഉത്തരം ടൈപ്പ് ചെയ്യുക...">`;
            }
            html += `</div>`;
            qArea.innerHTML += html;
        });
    }

    function submitStudentAnswers() {
        alert("നിങ്ങളുടെ ഉത്തരങ്ങൾ വിജയകരമായി സബ്മിറ്റ് ചെയ്തു! 🟢 അപ്‌ലോഡഡ്.");
        document.getElementById('studentTestBox').style.display = 'none';
        document.getElementById('studentResultBox').style.display = 'block';
        document.getElementById('resultStatusText').innerText = "🟢 അപ്‌ലോഡ് ചെയ്തു - വാല്യുവേഷൻ ഉടൻ ലഭ്യമാകും";
    }

    function downloadCertificate() {
        alert("🏆 സർട്ടിഫിക്കറ്റ് ഡൗൺലോഡ് ചെയ്യുന്നു...");
    }

    function viewAnswerKey() {
        alert("🔑 ആൻസർ കീ പ്രസിദ്ധീകരിച്ചിരിക്കുന്നു!");
    }
</script>

</body>
</html>
