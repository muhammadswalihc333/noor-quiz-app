<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noor V9 Old Theme Restored - Minute Custom</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#fdf8e8; font-family:sans-serif;}
.section-border{border:2.5px solid #14532d; border-radius:14px; background:white; padding:12px; margin-bottom:16px;}
.green-header{background:#14532d; color:white; text-align:center; font-weight:900; font-size:11px; padding:6px; border-radius:8px; margin-bottom:12px;}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, getDocFromServer, setDoc, updateDoc, collection, addDoc, getDocs, deleteDoc, enableNetwork, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDemo", authDomain: "noor-demo.firebaseapp.com", projectId: "noor-demo", appId: "1:demo" };
let db=null; try{ const app=initializeApp(firebaseConfig); db=getFirestore(app); await enableNetwork(db); }catch(e){}
window._db=db; window._doc=doc; window._getDoc=getDoc; window._getDocFromServer=getDocFromServer; window._setDoc=setDoc; window._updateDoc=updateDoc; window._collection=collection; window._addDoc=addDoc; window._getDocs=getDocs; window._deleteDoc=deleteDoc; window._serverTimestamp=serverTimestamp;
</script>
</head>
<body class="p-2">
<!-- 1 - Event Basic - OLD THEME EXACT -->
<div class="section-border">
<input id="eventName" placeholder="Event Name" class="w-full border-2 border-yellow-600/50 rounded-lg px-3 py-2 text-sm mb-2 outline-none">
<input id="eventPlace" placeholder="Place" class="w-full border rounded-lg px-3 py-2 text-sm mb-2">
<select id="eventCategory" class="w-full border rounded-lg px-3 py-2 text-sm mb-3"><option>Select Category</option><option>Madrasa</option><option>School</option></select>
<div class="grid grid-cols-2 gap-2">
<div><label class="text-[10px] font-bold">Logo</label><div class="bg-yellow-50 border rounded-lg p-1 flex"><input type="file" id="logoUpload" class="text-[11px] w-full"></div></div>
<div><label class="text-[10px] font-bold">Banner</label><div class="bg-blue-50 border rounded-lg p-1 flex"><input type="file" id="bannerUpload" class="text-[11px] w-full"></div></div>
</div>
</div>

<!-- 2 - Certificate 2 Options FULL - OLD THEME EXACT -->
<div class="section-border">
<div class="green-header">2 - Certificate 2 Options FULL</div>
<div class="flex gap-2 mb-3">
<button id="opt1Btn" onclick="switchCert(1)" class="bg-gray-200 px-3 py-1 rounded-lg text-[11px] font-bold">Opt1: Upload Full</button>
<button id="opt2Btn" onclick="switchCert(2)" class="bg-[#14532d] text-white px-3 py-1 rounded-lg text-[11px] font-bold">Opt2: Auto Gen</button>
</div>
<div id="certOpt1" class="hidden"><input type="file" id="certFullUpload" class="w-full text-xs"><button class="w-full mt-2 bg-yellow-600 text-white py-2 rounded text-xs">Upload Full Certificate</button></div>
<div id="certOpt2">
<div class="bg-blue-50/50 p-2 rounded border">
<p class="text-[11px] font-bold">Opt2: Auto Generate Full</p>
<div class="grid grid-cols-2 gap-2 mt-2">
<div><label class="text-[10px] font-bold">Bg</label><input type="file" id="certBg" class="w-full text-[10px] border rounded px-1 py-1"></div>
<div><label class="text-[10px] font-bold">Logo1</label><input type="file" id="certLogo1" class="w-full text-[10px] border rounded px-1 py-1"></div>
<div><label class="text-[10px] font-bold">Logo2/Seal</label><input type="file" id="certLogo2" class="w-full text-[10px] border rounded px-1 py-1"></div>
<div><label class="text-[10px] font-bold">Sign</label><input type="file" id="certSign" class="w-full text-[10px] border rounded px-1 py-1"></div>
</div>
<input id="certTitle" placeholder="Certificate of Appreciation" class="w-full border rounded px-2 py-2 mt-2 text-xs">
<input id="certSubTitle" placeholder="Noor Al Madrasa" value="Noor Al Madrasa" class="w-full border rounded px-2 py-2 mt-2 text-xs">
<div class="mt-3">
<div class="flex justify-between"><label class="text-xs font-bold">X:<span id="xVal">50%</span></label></div><input id="certX" type="range" min="0" max="100" value="50" class="w-full accent-blue-600">
<div class="flex justify-between mt-1"><label class="text-xs font-bold">Y:<span id="yVal">60%</span></label></div><input id="certY" type="range" min="0" max="100" value="60" class="w-full accent-blue-600">
<div class="flex justify-between mt-1"><label class="text-xs font-bold">S:<span id="sVal">24px</span></label></div><input id="certS" type="range" min="10" max="60" value="24" class="w-full accent-blue-600">
</div>
<input id="certColor" type="color" value="#14532d" class="w-full h-8 mt-3 rounded">
</div>
</div>
<div class="border-2 border-dashed border-gray-400 rounded-xl p-6 mt-3 text-center bg-white"><p id="sampleNamePreview" class="font-bold">Sample Name</p></div>
</div>

<!-- 3 - Settings Cloud - OLD THEME + MINUTE CUSTOM -->
<div class="section-border">
<div class="green-header">3 - Settings Cloud - Minute Custom Restored</div>
<div class="grid grid-cols-2 gap-2">
<div><label class="text-[10px] font-bold">Timer - Minute Custom</label><select id="setMinute" class="w-full border rounded-lg px-2 py-2 text-xs"><option value="5">5 Minute</option><option value="10" selected>10 Minute</option><option value="15">15 Minute</option><option value="20">20 Minute</option><option value="30">30 Minute</option><option value="60">60 Minute</option><option value="custom">Custom Minute Type</option></select><input id="setMinuteCustom" type="number" placeholder="Custom Minute" class="hidden w-full border-2 border-yellow-500 rounded-lg px-2 py-1 mt-1 text-xs"></div>
<div><label class="text-[10px] font-bold">Count</label><input id="setCount" type="number" value="20" class="w-full border rounded-lg px-2 py-2 text-xs"></div>
</div>
<div class="bg-yellow-50 p-2 rounded mt-2 border text-[10px]">
<label class="flex justify-between py-1"><span>Online/Offline</span><input id="setOnline" type="checkbox" checked></label>
<label class="flex justify-between py-1"><span>One Phone One Attempt</span><input id="setPhoneLock" type="checkbox" checked></label>
<label class="flex justify-between py-1"><span>One Device One Attempt</span><input id="setDeviceLock" type="checkbox" checked></label>
<label class="flex justify-between py-1"><span>Unlimited Delete</span><input id="setUnlimited" type="checkbox"></label>
</div>
<input id="eventIdShow" placeholder="Event ID Auto" class="w-full border rounded-lg px-2 py-2 mt-2 text-xs bg-gray-100">
<button onclick="createOnlineLink()" class="w-full mt-3 bg-green-600 hover:bg-green-700 text-white font-black py-3 rounded-xl text-sm">💚 CREATE ONLINE LINK</button>
<div class="grid grid-cols-2 gap-2 mt-2">
<button onclick="saveCloudSameLink()" class="bg-blue-600 text-white py-2.5 rounded-xl text-xs font-bold">💾 SAVE CLOUD Same Link</button>
<button onclick="clearAll()" class="bg-gray-200 py-2.5 rounded-xl text-xs font-bold">Clear</button>
</div>
<div id="generatedLink" class="hidden mt-3 break-all bg-green-50 border-2 border-green-600 p-3 rounded-xl text-[11px] font-bold"></div>
<p id="cloudStatus" class="text-[11px] mt-2 font-bold text-green-700"></p>
</div>

<!-- 4 - Questions Bulk Only Enough - OLD THEME EXACT -->
<div class="section-border">
<div class="green-header">4 - Questions Bulk Only Enough</div>
<textarea id="qBulk" rows="5" placeholder="Q | a,b,c,d | ans - Each line&#10;Example: നബി ജന്മദേശം? | മക്ക,മദീന,ത്വാഇഫ്,യമൻ | 0" class="w-full border-2 border-yellow-600/30 rounded-xl p-3 text-xs"></textarea>
<button onclick="bulkAdd()" class="w-full mt-3 bg-[#8B5A00] text-white py-2.5 rounded-xl text-xs font-bold">📚 Bulk Add - Bulk Only Enough</button>
<div class="mt-3">
<div class="bg-[#14532d] text-white flex justify-between items-center px-3 py-2 rounded-t-xl"><span class="text-xs font-bold">Questions List</span><span id="quota" class="bg-yellow-400 text-black px-2 py-0.5 rounded-full text-[10px] font-bold">Quota: 0/15</span></div>
<div id="qList" class="bg-yellow-50/50 border-2 border-t-0 rounded-b-xl p-3 min-h-[80px] text-xs text-center text-gray-500">No Questions<br>Bulk Add ചെയ്യൂ</div>
</div>
</div>

<script>
let currentEventId = new URLSearchParams(location.search).get('event');
let questions=[]; let certType=2;
function switchCert(t){ certType=t; document.getElementById('certOpt1').classList.toggle('hidden', t!==1); document.getElementById('certOpt2').classList.toggle('hidden', t!==2); document.getElementById('opt1Btn').className = t===1? 'bg-[#14532d] text-white px-3 py-1 rounded-lg text-[11px] font-bold' : 'bg-gray-200 px-3 py-1 rounded-lg text-[11px] font-bold'; document.getElementById('opt2Btn').className = t===2? 'bg-[#14532d] text-white px-3 py-1 rounded-lg text-[11px] font-bold' : 'bg-gray-200 px-3 py-1 rounded-lg text-[11px] font-bold'; }
document.getElementById('certX')?.addEventListener('input', e=>{ document.getElementById('xVal').innerText=e.target.value+'%'; updatePreview(); });
document.getElementById('certY')?.addEventListener('input', e=>{ document.getElementById('yVal').innerText=e.target.value+'%'; updatePreview(); });
document.getElementById('certS')?.addEventListener('input', e=>{ document.getElementById('sVal').innerText=e.target.value+'px'; updatePreview(); });
document.getElementById('setMinute')?.addEventListener('change', e=>{ if(e.target.value==='custom'){ document.getElementById('setMinuteCustom').classList.remove('hidden'); }else{ document.getElementById('setMinuteCustom').classList.add('hidden'); } });
function updatePreview(){ const x=document.getElementById('certX').value; const y=document.getElementById('certY').value; const s=document.getElementById('certS').value; const preview=document.getElementById('sampleNamePreview'); preview.style.marginLeft=x+'%'; preview.style.marginTop='10px'; preview.style.fontSize=s+'px'; preview.style.transform='translateX(-50%)'; }
function bulkAdd(){
 const txt=document.getElementById('qBulk').value.trim(); if(!txt) return alert('Type Questions');
 const lines=txt.split('\n'); lines.forEach(line=>{
  const parts=line.split('|'); if(parts.length<3) return;
  const q=parts[0].trim(); const opts=parts[1].split(',').map(o=>o.trim()); const ans=parseInt(parts[2].trim());
  questions.push({q, opts, ans});
 });
 document.getElementById('qList').innerHTML=''; questions.forEach((qq,i)=>{ document.getElementById('qList').innerHTML+=`<div class="text-left border-b py-1">${i+1}. ${qq.q} - ${qq.opts.join('/')}</div>`; });
 document.getElementById('quota').innerText=`Quota: ${questions.length}/15`;
 alert(questions.length+' Questions Added');
}
async function createOnlineLink(){
 const title=document.getElementById('eventName').value||'Noor Event'; const place=document.getElementById('eventPlace').value||'';
 let minute=parseInt(document.getElementById('setMinute').value); if(document.getElementById('setMinute').value==='custom'){ minute=parseInt(document.getElementById('setMinuteCustom').value||10); }
 const count=parseInt(document.getElementById('setCount').value||10);
 const payload={title, place, questions, settings:{minute, count, phoneLock:document.getElementById('setPhoneLock').checked, deviceLock:document.getElementById('setDeviceLock').checked, unlimited:document.getElementById('setUnlimited').checked, online:document.getElementById('setOnline').checked}, banner:{logo:null}, certificate:{type:certType, x:document.getElementById('certX').value, y:document.getElementById('certY').value, s:document.getElementById('certS').value}, updatedAt:new Date().toISOString()};
 try{
  let id=currentEventId; if(id && window._db){ await window._setDoc(window._doc(window._db,'events',id),payload,{merge:true}); }else if(window._db){ const r=await window._addDoc(window._collection(window._db,'events'),payload); id=r.id; currentEventId=id; } else { id='local_'+Date.now(); currentEventId=id; }
  const link=location.origin+location.pathname+'?event='+id;
  const d=document.getElementById('generatedLink'); d.innerText=link; d.classList.remove('hidden'); document.getElementById('eventIdShow').value=id; document.getElementById('cloudStatus').innerText='✅ Link Ready - '+minute+' Minute Custom - Old Theme Restored!';
  navigator.clipboard.writeText(link);
 }catch(e){ document.getElementById('cloudStatus').innerText=e.message; }
}
function saveCloudSameLink(){ createOnlineLink(); }
function clearAll(){ if(confirm('Clear All?')){ questions=[]; document.getElementById('qList').innerHTML='No Questions'; document.getElementById('quota').innerText='Quota: 0/15'; document.getElementById('qBulk').value=''; } }
switchCert(2); updatePreview();
</script>
</body>
                                                                                                                   </html>
